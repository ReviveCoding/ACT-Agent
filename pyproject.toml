[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "act-agent"
version = "0.1.0"
description = "Auditable advertising-operations digital twin and agent experiments"
requires-python = ">=3.12"
dependencies = ["typer>=0.16,<1", "pydantic>=2.11,<3", "polars>=1.30,<2", "duckdb>=1.3,<2", "pyarrow>=20,<25", "scipy>=1.15,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.16,<2", "build>=1.2,<2"]
gpu = ["torch>=2.7", "transformers>=4.52", "peft>=0.15", "trl>=0.19", "bitsandbytes>=0.46"]

[project.scripts]
act-agent = "act_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/act_agent"]

[tool.hatch.build.targets.sdist]
only-include = ["src/act_agent", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "peft.*", "trl.*", "datasets.*", "bitsandbytes.*"]
follow_imports = "skip"
ignore_missing_imports = true
